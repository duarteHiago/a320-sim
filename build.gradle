// Versão do SICA: vale para os .jar e para o instalador (o único lugar para mudar)
ext.appVersion = '1.0.0'

subprojects {
    apply plugin: 'java'

    group = 'br.a320sim'
    version = rootProject.appVersion

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }
}
