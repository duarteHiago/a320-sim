apply plugin: 'application'

def gdxVersion = '1.12.1'

dependencies {
    implementation project(':core')
    implementation project(':flightmodel')
    implementation project(':host')
    implementation project(':net')
    implementation project(':dados')
    runtimeOnly project(':cartridges')

    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    // Controles (Xbox, PlayStation, genéricos) via SDL
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-core:2.2.3"
    implementation "com.badlogicgames.gdx-controllers:gdx-controllers-desktop:2.2.3"
}

application {
    mainClass = 'br.a320sim.cockpit.CockpitLauncher'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
    // Repassa -Dsim.* da linha de comando do Gradle para o simulador
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('sim.') }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // NomesVisiveisTest lê o código de cockpit e host a partir da raiz do projeto
    systemProperty 'sim.projectRoot', rootProject.projectDir.absolutePath
}
