apply plugin: 'application'

def gdxVersion = '1.12.1'

dependencies {
    implementation project(':core')
    implementation project(':flightmodel')
    implementation project(':host')
    implementation project(':net')
    runtimeOnly project(':cartridges')

    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-lwjgl3:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
}

application {
    mainClass = 'br.a320sim.cockpit.CockpitLauncher'
}

tasks.named('run') {
    workingDir = rootProject.projectDir
    // Repassa -Dsim.* da linha de comando do Gradle para o simulador
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('sim.') }
}
